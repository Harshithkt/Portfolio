  <!-- Resolve the colour theme before first paint so dark-mode visitors never see a light flash -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
      if (theme === "dark") {
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121110");
      }
    })();
  </script>
